name: Deploy WordPress to Sakura

on:
  push:
    branches:
      - main
      - V2
    paths:
      - 'wordpress/**'
      - '.github/workflows/moriwp-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SAKURA_SSH_KEY }}

      - name: Trust host
        run: |
          set -e
          mkdir -p ~/.ssh
          HOST_CLEAN="$(printf '%s' "${{ secrets.SAKURA_HOST }}" | tr -d '\r\n' | xargs)"
          ssh-keyscan -H "$HOST_CLEAN" >> ~/.ssh/known_hosts

      - name: Debug WordPress folder
        run: |
          set -e
          echo "=== Current directory ==="
          pwd
          echo "=== WordPress directory structure ==="
          ls -la wordpress/ || echo "wordpress directory not found"
          echo "=== Themes ==="
          ls -la wordpress/wp-content/themes/ || echo "themes directory not found"
          echo "=== Plugins ==="
          ls -la wordpress/wp-content/plugins/ || echo "plugins directory not found"

      - name: Package WordPress files
        run: |
          set -euo pipefail
          # WordPressディレクトリ存在チェック
          if [ ! -d "wordpress" ]; then
            echo "ERROR: wordpress ディレクトリが存在しません"
            exit 1
          fi
          # テーマとプラグインのみを圧縮（投稿・コメントはデータベースにあるため除外不要）
          cd wordpress
          tar -czf ../wordpress-deploy.tar.gz \
            --exclude='wp-config.php' \
            --exclude='.DS_Store' \
            --exclude='wp-content/uploads' \
            --exclude='wp-content/cache' \
            --exclude='wp-content/upgrade' \
            --exclude='wp-content/backup*' \
            --exclude='wp-content/backups' \
            --exclude='wp-content/debug.log' \
            --exclude='wp-content/advanced-cache.php' \
            --exclude='wp-content/wp-cache-config.php' \
            --exclude='wp-content/blogs.dir' \
            --exclude='wp-content/upgrade-temp-backup' \
            wp-content/themes \
            wp-content/plugins
          cd ..
          echo "Package created: wordpress-deploy.tar.gz"
          ls -lh wordpress-deploy.tar.gz

      - name: Upload to server
        run: |
          set -euo pipefail
          USER_CLEAN="$(printf '%s' "${{ secrets.SAKURA_USER }}" | tr -d '\r\n' | xargs)"
          HOST_CLEAN="$(printf '%s' "${{ secrets.SAKURA_HOST }}" | tr -d '\r\n' | xargs)"
          # 一時ディレクトリを作成
          ssh "${USER_CLEAN}@${HOST_CLEAN}" "mkdir -p ~/tmp"
          # ファイルを転送
          scp wordpress-deploy.tar.gz "${USER_CLEAN}@${HOST_CLEAN}:~/tmp/wordpress-deploy.tar.gz"
          echo "File uploaded successfully"

      - name: Deploy on server
        run: |
          set -euo pipefail
          USER_CLEAN="$(printf '%s' "${{ secrets.SAKURA_USER }}" | tr -d '\r\n' | xargs)"
          HOST_CLEAN="$(printf '%s' "${{ secrets.SAKURA_HOST }}" | tr -d '\r\n' | xargs)"
          WP_PATH_CLEAN="$(printf '%s' "${{ secrets.WP_PATH }}" | tr -d '\r\n' | xargs)"
          
          ssh "${USER_CLEAN}@${HOST_CLEAN}" << 'DEPLOY_SCRIPT'
            set -euo pipefail
            WP_PATH="${WP_PATH_CLEAN}"
            
            echo "=== Current directory ==="
            pwd
            
            echo "=== WordPress path ==="
            echo "${WP_PATH}"
            
            echo "=== Checking WordPress directory ==="
            if [ ! -d "${WP_PATH}" ]; then
              echo "ERROR: WordPress directory not found: ${WP_PATH}"
              exit 1
            fi
            
            cd "${WP_PATH}"
            
            echo "=== Creating backup ==="
            BACKUP_DIR="wordpress-backup-$(date +%Y%m%d_%H%M%S)"
            mkdir -p "${BACKUP_DIR}"
            if [ -d "wp-content/themes" ]; then
              cp -r wp-content/themes "${BACKUP_DIR}/themes" || true
            fi
            if [ -d "wp-content/plugins" ]; then
              cp -r wp-content/plugins "${BACKUP_DIR}/plugins" || true
            fi
            echo "Backup created: ${BACKUP_DIR}"
            
            echo "=== Extracting files ==="
            tar -xzf ~/tmp/wordpress-deploy.tar.gz
            
            echo "=== Setting permissions ==="
            chmod -R 755 wp-content/themes/ 2>/dev/null || true
            chmod -R 755 wp-content/plugins/ 2>/dev/null || true
            
            echo "=== Cleaning up ==="
            rm -f ~/tmp/wordpress-deploy.tar.gz
            
            echo "=== Deployment completed successfully! ==="
            echo "Themes and plugins have been updated."
            echo "Posts and comments in the database are not affected."
          DEPLOY_SCRIPT
