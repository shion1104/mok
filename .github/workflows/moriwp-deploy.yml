name: Deploy WordPress to Sakura

on:
  push:
    branches:
      - main
      - V2
    paths:
      - 'wordpress/**'
      - '.github/workflows/moriwp-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SAKURA_SSH_KEY }}

      - name: Trust host
        run: |
          set -e
          mkdir -p ~/.ssh
          HOST_CLEAN="$(printf '%s' "${{ secrets.SAKURA_HOST }}" | tr -d '\r\n' | xargs)"
          ssh-keyscan -H "$HOST_CLEAN" >> ~/.ssh/known_hosts

      - name: Debug WordPress folder
        run: |
          set -e
          echo "=== root ==="
          ls -la
          echo "=== wordpress ==="
          ls -la wordpress || true
          echo "=== wordpress/wp-content/themes ==="
          ls -la wordpress/wp-content/themes || true
          echo "=== wordpress/wp-content/plugins ==="
          ls -la wordpress/wp-content/plugins || true

      - name: Package & Upload WordPress (excluding posts/comments)
        run: |
          set -euo pipefail
          USER_CLEAN="$(printf '%s' "${{ secrets.SAKURA_USER }}" | tr -d '\r\n' | xargs)"
          HOST_CLEAN="$(printf '%s' "${{ secrets.SAKURA_HOST }}" | tr -d '\r\n' | xargs)"
          # WordPressディレクトリ存在チェック
          if [ ! -d "wordpress" ]; then
            echo "ERROR: wordpress ディレクトリが存在しません"
            exit 1
          fi
          # 圧縮（投稿・コメントデータは除外、テーマ・プラグイン・設定ファイルのみ）
          tar -czf wordpress.tar.gz \
            --exclude='wordpress/wp-config.php' \
            --exclude='wordpress/.DS_Store' \
            --exclude='wordpress/wp-content/uploads' \
            --exclude='wordpress/wp-content/cache' \
            --exclude='wordpress/wp-content/upgrade' \
            --exclude='wordpress/wp-content/backup*' \
            --exclude='wordpress/wp-content/backups' \
            --exclude='wordpress/wp-content/debug.log' \
            --exclude='wordpress/wp-content/advanced-cache.php' \
            --exclude='wordpress/wp-content/wp-cache-config.php' \
            -C . wordpress/wp-content/themes \
            -C . wordpress/wp-content/plugins \
            -C . wordpress/wp-includes \
            -C . wordpress/wp-admin \
            -C . wordpress/wp-*.php \
            -C . wordpress/xmlrpc.php \
            -C . wordpress/index.php \
            -C . wordpress/license.txt \
            -C . wordpress/readme.html
          # 転送
          ssh "${USER_CLEAN}@${HOST_CLEAN}" "mkdir -p ~/tmp"
          scp wordpress.tar.gz "${USER_CLEAN}@${HOST_CLEAN}:~/tmp/wordpress.tar.gz"

      - name: Extract on server
        run: |
          set -euo pipefail
          USER_CLEAN="$(printf '%s' "${{ secrets.SAKURA_USER }}" | tr -d '\r\n' | xargs)"
          HOST_CLEAN="$(printf '%s' "${{ secrets.SAKURA_HOST }}" | tr -d '\r\n' | xargs)"
          WP_PATH_CLEAN="$(printf '%s' "${{ secrets.WP_PATH }}" | tr -d '\r\n' | xargs)"
          ssh "${USER_CLEAN}@${HOST_CLEAN}" \
            "cd ${WP_PATH_CLEAN} && \
             tar -xzf ~/tmp/wordpress.tar.gz && \
             chmod -R 755 wp-content/themes/ wp-content/plugins/ wp-admin/ wp-includes/ && \
             chmod 644 wp-*.php xmlrpc.php index.php license.txt readme.html 2>/dev/null || true && \
             rm -f ~/tmp/wordpress.tar.gz && \
             echo 'Deployment completed successfully! (Posts and comments excluded)'"
